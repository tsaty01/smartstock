<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${p.name()}, ~{::#page})}">
<body>
<div id="page">
	<div class="page-head">
		<h1 th:text="${p.name()}">Product</h1>
		<a class="btn tonal" th:if="${management}" th:href="@{/products/{id}/edit(id=${p.id()})}">Edit</a>
	</div>
	<div class="grid">
		<div class="card">
			<img th:if="${p.imageUrl()}" th:src="@{/products/{id}/image(id=${p.id()})}" alt=""
				 style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius-m);margin-bottom:1rem">
			<p style="font-size:1.5rem;font-weight:600;margin:0" class="money" th:text="${@fmt.money(p.price())}"></p>
			<p th:if="${staff}"><th:block th:replace="~{fragments :: stock(${p})}"></th:block></p>
			<table>
				<tr><th>Category</th><td th:text="${p.categoryName()}"></td></tr>
				<tr th:if="${p.barcode()}"><th>Barcode</th><td th:text="${p.barcode()}"></td></tr>
				<tr th:if="${p.expiryDate()}"><th>Expires</th>
					<td th:text="${@fmt.date(p.expiryDate())} + ' (' + ${p.daysToExpiry()} + ' days)'"></td></tr>
				<tr th:if="${p.warningLabel()}"><th>Warning</th><td th:text="${p.warningLabel()}"></td></tr>
				<tr th:if="${staff}"><th>Reorder level</th><td th:text="${p.reorderLevel()}"></td></tr>
				<tr th:unless="${p.active()}"><th>Status</th><td>Inactive, not for sale</td></tr>
			</table>
			<p th:if="${p.description()}" th:text="${p.description()}"></p>
		</div>

		<div th:if="${management}" style="display:grid;gap:1rem;align-content:start">
			<form class="card stack" method="post" th:action="@{/products/{id}/restock(id=${p.id()})}">
				<h3>Restock</h3>
				<div class="row">
					<label>Quantity received <input type="number" name="quantity" min="1" max="1000000" required></label>
					<label>Notes <input name="notes" maxlength="255" placeholder="Supplier invoice"></label>
				</div>
				<button type="submit" th:disabled="${!p.active()}">Add stock</button>
			</form>
			<form class="card stack" method="post" th:action="@{/products/{id}/adjust(id=${p.id()})}">
				<h3>Adjust stock</h3>
				<div class="row">
					<label>Change (+/−) <input type="number" name="change" required></label>
					<label>Reason
						<select name="reason">
							<option value="ADJUSTMENT">Count correction</option>
							<option value="EXPIRED_REMOVAL">Expired removal</option>
						</select>
					</label>
				</div>
				<label>Notes <input name="notes" maxlength="255" required></label>
				<button class="tonal" type="submit">Save adjustment</button>
			</form>
			<form class="card stack" method="post" th:action="@{/products/{id}/image(id=${p.id()})}" enctype="multipart/form-data">
				<h3>Photo</h3>
				<input type="file" name="file" accept="image/png,image/jpeg,image/webp" required aria-label="Product photo">
				<button class="outlined" type="submit">Upload</button>
			</form>
		</div>
	</div>

	<th:block th:if="${movements}">
		<h2>Stock history</h2>
		<div class="table-wrap">
			<table>
				<thead><tr><th>When</th><th>Reason</th><th class="num">Change</th><th>By</th><th>Notes</th></tr></thead>
				<tbody>
				<tr th:each="m : ${movements}">
					<td th:text="${@fmt.time(m.createdAt())}"></td>
					<td th:text="${@fmt.title(m.reason())}"></td>
					<td class="num" th:text="${m.change() > 0} ? '+' + ${m.change()} : ${m.change()}"></td>
					<td th:text="${m.performedBy()}"></td>
					<td>
						<a th:if="${m.orderId()}" th:href="@{/orders/{id}(id=${m.orderId()})}" th:text="'Order #' + ${m.orderId()}"></a>
						<span th:text="${m.notes()}"></span>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</th:block>
</div>
</body>
</html>
