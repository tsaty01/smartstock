<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${id} ? 'Edit product' : 'New product', ~{::#page})}">
<body>
<div id="page">
	<div class="page-head"><h1 th:text="${id} ? 'Edit product' : 'New product'">Product</h1></div>
	<form class="card stack" method="post" th:action="${id} ? @{/products/{id}/edit(id=${id})} : @{/products/new}">
		<label>Name <input name="name" th:value="${form?.name()}" required maxlength="150"></label>
		<span class="field-error" th:if="${errors['name']}" th:text="${errors['name']}"></span>
		<div class="row">
			<label>Category
				<select name="categoryId" required>
					<option value="">Choose…</option>
					<option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
							th:selected="${form != null and form.categoryId() == c.id}"></option>
				</select>
			</label>
			<label>Price (₹) <input type="number" name="price" step="0.01" min="0" th:value="${form?.price()}" required></label>
		</div>
		<span class="field-error" th:if="${errors['categoryId']}" th:text="${errors['categoryId']}"></span>
		<span class="field-error" th:if="${errors['price']}" th:text="${errors['price']}"></span>
		<div class="row">
			<label>Reorder level <input type="number" name="reorderLevel" min="0" th:value="${form?.reorderLevel()} ?: 10" required></label>
			<label th:unless="${id}">Opening stock <input type="number" name="initialStock" min="0" th:value="${form?.initialStock()} ?: 0"></label>
			<label>Barcode <input name="barcode" maxlength="50" th:value="${form?.barcode()}"></label>
		</div>
		<div class="row">
			<label>Expiry date <input type="date" name="expiryDate" th:value="${form?.expiryDate()}"></label>
			<label>Warning label
				<select name="warningLabel">
					<option value="">None</option>
					<option th:each="w : ${warningLabels}" th:value="${w}" th:text="${w}"
							th:selected="${form != null and form.warningLabel() == w}"></option>
				</select>
			</label>
		</div>
		<label>Description <textarea name="description" rows="3" th:text="${form?.description()}"></textarea></label>
		<label class="check"><input type="checkbox" name="active" value="true" th:checked="${form == null or form.active()}"> For sale</label>
		<div class="row" style="justify-content:flex-start">
			<button type="submit" style="flex:0 0 auto">Save</button>
			<a class="btn text" style="flex:0 0 auto" th:href="${id} ? @{/products/{id}(id=${id})} : @{/products}">Cancel</a>
		</div>
	</form>
</div>
</body>
</html>
