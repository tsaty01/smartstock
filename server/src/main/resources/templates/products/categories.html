<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Categories', ~{::#page})}">
<body>
<div id="page">
	<div class="page-head"><h1>Categories</h1></div>
	<form class="card row" method="post" th:action="@{/categories}" style="margin-bottom:1rem">
		<label>New category <input name="name" required maxlength="100"></label>
		<label>Description <input name="description" maxlength="255"></label>
		<button type="submit" style="flex:0 0 auto">Add</button>
	</form>
	<div class="table-wrap">
		<table>
			<thead><tr><th>Name</th><th>Description</th><th></th></tr></thead>
			<tbody>
			<tr th:each="c : ${categories}">
				<td colspan="3">
					<form class="row" method="post" th:action="@{/categories/{id}(id=${c.id})}">
						<input name="name" th:value="${c.name}" required maxlength="100" aria-label="Name">
						<input name="description" th:value="${c.description}" maxlength="255" aria-label="Description">
						<button class="text small" type="submit" style="flex:0 0 auto">Save</button>
					</form>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</div>
</body>
</html>
