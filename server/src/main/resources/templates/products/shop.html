<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Shop', ~{::#page})}">
<body>
<div id="page">
	<div class="page-head"><h1>Shop</h1></div>
	<form class="row" method="get" th:action="@{/shop}" style="margin-bottom:1rem">
		<input class="search" type="search" name="q" th:value="${q}" placeholder="Search products" aria-label="Search">
		<select name="categoryId" aria-label="Category" style="flex:0 1 220px">
			<option value="">All categories</option>
			<option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option>
		</select>
		<button class="tonal" type="submit" style="flex:0 0 auto">Search</button>
	</form>
	<div class="table-wrap">
		<table>
			<thead><tr><th>Product</th><th>Category</th><th class="num">Price</th></tr></thead>
			<tbody>
			<tr th:each="p : ${products}">
				<td><a th:href="@{/products/{id}(id=${p.id()})}" th:text="${p.name()}"></a>
					<div class="muted" style="font-size:.8125rem" th:if="${p.warningLabel()}" th:text="${p.warningLabel()}"></div></td>
				<td th:text="${p.categoryName()}"></td>
				<td class="num" th:text="${@fmt.money(p.price())}"></td>
			</tr>
			<tr th:if="${products.isEmpty()}"><td colspan="3" class="empty">No products match</td></tr>
			</tbody>
		</table>
	</div>
</div>
</body>
</html>
