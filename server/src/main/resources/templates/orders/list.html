<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${staff} ? 'Orders' : 'My purchases', ~{::#page})}">
<body>
<div id="page">
	<div class="page-head"><h1 th:text="${staff} ? 'Orders' : 'My purchases'">Orders</h1></div>
	<div class="table-wrap">
		<table>
			<thead><tr><th>Bill</th><th>Date</th><th th:if="${staff}">Customer</th><th th:if="${staff}">Cashier</th><th>Payment</th><th class="num">Items</th><th class="num">Total</th></tr></thead>
			<tbody>
			<tr th:each="o : ${orders.content}">
				<td><a th:href="@{/orders/{id}(id=${o.id()})}" th:text="'#' + ${o.id()}"></a></td>
				<td th:text="${@fmt.time(o.createdAt())}"></td>
				<td th:if="${staff}" th:text="${o.customerName()}"></td>
				<td th:if="${staff}" th:text="${o.cashierName()}"></td>
				<td th:text="${@fmt.title(o.paymentMode())}"></td>
				<td class="num" th:text="${o.itemCount()}"></td>
				<td class="num" th:text="${@fmt.money(o.total())}"></td>
			</tr>
			<tr th:if="${orders.content.isEmpty()}"><td colspan="7" class="empty" th:text="${staff} ? 'No sales yet' : 'No purchases yet'"></td></tr>
			</tbody>
		</table>
	</div>
	<div class="row" style="margin-top:1rem;justify-content:space-between" th:if="${orders.totalPages > 1}">
		<a class="btn outlined" style="flex:0 0 auto" th:if="${orders.hasPrevious()}" th:href="@{/orders(page=${orders.number - 1})}">Newer</a>
		<span class="muted" style="flex:0 0 auto" th:text="'Page ' + ${orders.number + 1} + ' of ' + ${orders.totalPages}"></span>
		<a class="btn outlined" style="flex:0 0 auto" th:if="${orders.hasNext()}" th:href="@{/orders(page=${orders.number + 1})}">Older</a>
	</div>
</div>
</body>
</html>
