<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Bill #' + ${r.id()}, ~{::#page})}">
<body>
<div id="page">
	<div class="page-head no-print">
		<h1 th:text="'Bill #' + ${r.id()}">Bill</h1>
		<div style="display:flex;gap:.5rem">
			<button class="tonal" type="button" onclick="window.print()">Print</button>
			<a class="btn" href="/pos" th:if="${staff}">New sale</a>
		</div>
	</div>
	<article class="card receipt">
		<h2 class="display" style="margin:0;color:var(--primary)">SmartStock</h2>
		<p class="muted" style="margin:.25rem 0 1rem" th:text="'Bill #' + ${r.id()} + ' · ' + ${@fmt.time(r.createdAt())}"></p>
		<div>Customer: <span th:text="${r.customerName()} + (${r.customerPhone()} ? ' · ' + ${r.customerPhone()} : '')"></span></div>
		<div>Cashier: <span th:text="${r.cashierName()}"></span></div>
		<div>Payment: <span th:text="${@fmt.title(r.paymentMode())}"></span></div>
		<div class="lines">
			<div class="line" th:each="l : ${r.items()}">
				<span><span th:text="${l.productName()}"></span><br>
					<small class="muted num" th:text="${l.quantity()} + ' × ' + ${@fmt.money(l.unitPrice())}"></small></span>
				<span class="money" th:text="${@fmt.money(l.lineTotal())}"></span>
			</div>
		</div>
		<div class="line"><span>Subtotal</span><span class="money" th:text="${@fmt.money(r.subtotal())}"></span></div>
		<div class="line" th:if="${r.discount().signum() > 0}"><span>Discount</span><span class="money" th:text="'−' + ${@fmt.money(r.discount())}"></span></div>
		<div class="line"><span th:text="'GST ' + ${@fmt.percent(r.taxRate())}"></span><span class="money" th:text="${@fmt.money(r.tax())}"></span></div>
		<div class="line total"><span>Total</span><span class="money" th:text="${@fmt.money(r.total())}"></span></div>
	</article>
</div>
</body>
</html>
