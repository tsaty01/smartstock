<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in · SmartStock</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="auth">
	<form class="card" method="post" th:action="@{/login}">
		<h1>SmartStock</h1>
		<p class="muted" style="text-align:center;margin:0">Inventory and billing for your store</p>
		<div class="flash error" role="alert" th:if="${param.error}">Invalid username or password, or the account is disabled.</div>
		<div class="flash error" role="alert" th:if="${param.disabled}">Your account was disabled. Contact an administrator.</div>
		<div class="flash" role="status" th:if="${param.logout}">You have signed out.</div>
		<div class="flash" role="status" th:if="${param.registered}">Account created. Sign in to continue.</div>
		<label>Username <input name="username" autocomplete="username" required autofocus></label>
		<label>Password <input name="password" type="password" autocomplete="current-password" required></label>
		<button type="submit">Sign in</button>
		<a class="btn text" href="/register">New customer? Create an account</a>
	</form>
</main>
</body>
</html>
