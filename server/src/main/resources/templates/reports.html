<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Reports', ~{::#page})}">
<body>
<div id="page">
	<div class="page-head">
		<h1>Reports</h1>
		<form class="row" method="get" th:action="@{/reports}">
			<label>From <input type="date" name="from" th:value="${from}"></label>
			<label>To <input type="date" name="to" th:value="${to}"></label>
			<button class="tonal" type="submit">Show</button>
		</form>
	</div>

	<h2>Sales by category</h2>
	<div class="table-wrap">
		<table>
			<thead><tr><th>Category</th><th class="num">Units</th><th class="num">Revenue</th></tr></thead>
			<tbody>
			<tr th:each="c : ${categories}">
				<td th:text="${c.name()}"></td>
				<td class="num" th:text="${c.units()}"></td>
				<td class="num" th:text="${@fmt.money(c.revenue())}"></td>
			</tr>
			</tbody>
		</table>
	</div>

	<h2>Sales by product</h2>
	<div class="table-wrap">
		<table>
			<thead><tr><th>Product</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th><th class="num">Orders</th><th class="num">Units</th><th class="num">Revenue</th></tr></thead>
			<tbody>
			<tr th:each="p : ${products}">
				<td><a th:href="@{/products/{id}(id=${p.id()})}" th:text="${p.name()}"></a></td>
				<td th:text="${p.category()}"></td>
				<td class="num" th:text="${@fmt.money(p.price())}"></td>
				<td class="num" th:text="${p.stock()}"></td>
				<td class="num" th:text="${p.orders()}"></td>
				<td class="num" th:text="${p.units()}"></td>
				<td class="num" th:text="${@fmt.money(p.revenue())}"></td>
			</tr>
			</tbody>
		</table>
	</div>

	<h2>Slow movers: in stock, no sale in 30 days</h2>
	<div class="table-wrap">
		<table>
			<thead><tr><th>Product</th><th class="num">Stock</th><th>Expiry</th></tr></thead>
			<tbody>
			<tr th:each="a : ${clearance}">
				<td><a th:href="@{/products/{id}(id=${a.id()})}" th:text="${a.name()}"></a></td>
				<td class="num" th:text="${a.stock()}"></td>
				<td th:text="${a.expiryDate() != null} ? ${@fmt.date(a.expiryDate())} : '–'"></td>
			</tr>
			<tr th:if="${clearance.isEmpty()}"><td colspan="3" class="empty">Every stocked product sold recently</td></tr>
			</tbody>
		</table>
	</div>
</div>
</body>
</html>
