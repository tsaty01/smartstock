<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Error · SmartStock</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="auth">
	<div class="card">
		<h1 th:text="${status}">Error</h1>
		<p th:switch="${status}">
			<span th:case="403">You do not have access to this page.</span>
			<span th:case="404" th:text="${message} ?: 'This page does not exist.'">Not found</span>
			<span th:case="*" th:text="${message} ?: 'Something went wrong. Please try again.'">Error</span>
		</p>
		<a class="btn" href="/">Back to SmartStock</a>
	</div>
</main>
</body>
</html>
