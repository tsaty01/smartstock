<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Alerts', ~{::#page})}">
<body>
<div id="page">
	<div class="page-head"><h1>Alerts</h1></div>
	<div class="table-wrap">
		<table>
			<thead><tr><th>Alert</th><th>Raised</th><th></th></tr></thead>
			<tbody>
			<tr th:each="a : ${alerts}">
				<td>
					<a th:if="${a.productId != null}" th:href="@{/products/{id}(id=${a.productId})}" th:text="${a.message}"
					   th:style="${a.read} ? '' : 'font-weight:600'"></a>
					<span th:if="${a.productId == null}" th:text="${a.message}"></span>
				</td>
				<td class="muted" th:text="${@fmt.time(a.createdAt)}"></td>
				<td class="right">
					<form th:unless="${a.read}" method="post" th:action="@{/alerts/{id}/read(id=${a.id})}">
						<button class="text small" type="submit">Mark read</button>
					</form>
				</td>
			</tr>
			<tr th:if="${alerts.isEmpty()}"><td colspan="3" class="empty">No alerts</td></tr>
			</tbody>
		</table>
	</div>
</div>
</body>
</html>
