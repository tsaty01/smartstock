<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Sell', ~{::#page})}">
<body>
<div id="page">
	<div class="page-head">
		<h1>Sell</h1>
		<form method="post" th:action="@{/pos/clear}" th:unless="${cart.isEmpty() and customer == null}">
			<button class="text" type="submit">Clear sale</button>
		</form>
	</div>
	<div class="pos">
		<section>
			<form class="row" method="get" th:action="@{/pos}" style="margin-bottom:.75rem">
				<input class="search" type="search" name="q" th:value="${q}" placeholder="Search products" aria-label="Search products" autofocus>
				<button class="tonal" type="submit" style="flex:0 0 auto">Search</button>
			</form>
			<form class="row" method="post" th:action="@{/pos/add}" style="margin-bottom:1rem">
				<input name="barcode" placeholder="Scan or type a barcode, then Enter" aria-label="Barcode" autocomplete="off">
				<button class="outlined" type="submit" style="flex:0 0 auto">Add</button>
			</form>

			<div class="table-wrap" th:if="${results}" style="margin-bottom:1.5rem">
				<table>
					<thead><tr><th>Product</th><th class="num">Price</th><th>Stock</th><th></th></tr></thead>
					<tbody>
					<tr th:each="p : ${results}">
						<td th:text="${p.name()}"></td>
						<td class="num" th:text="${@fmt.money(p.price())}"></td>
						<td><th:block th:replace="~{fragments :: stock(${p})}"></th:block></td>
						<td class="right">
							<form method="post" th:action="@{/pos/add}"><input type="hidden" name="productId" th:value="${p.id()}">
								<button class="small" type="submit">Add</button></form>
						</td>
					</tr>
					<tr th:if="${results.isEmpty()}"><td colspan="4" class="empty">No sellable products match</td></tr>
					</tbody>
				</table>
			</div>

			<h2 style="margin-top:0">Cart</h2>
			<div class="table-wrap">
				<table>
					<thead><tr><th>Item</th><th class="num">Price</th><th>Quantity</th><th class="num">Amount</th></tr></thead>
					<tbody>
					<tr th:each="line : ${quote?.items()}">
						<td th:text="${line.productName()}"></td>
						<td class="num" th:text="${@fmt.money(line.unitPrice())}"></td>
						<td>
							<form class="qty" method="post" th:action="@{/pos/quantity}">
								<input type="hidden" name="productId" th:value="${line.productId()}">
								<input type="number" name="quantity" min="0" th:value="${line.quantity()}" aria-label="Quantity">
								<button class="text small" type="submit">Update</button>
							</form>
						</td>
						<td class="num" th:text="${@fmt.money(line.lineTotal())}"></td>
					</tr>
					<tr th:if="${cart.isEmpty()}"><td colspan="4" class="empty">Search or scan products to start a sale</td></tr>
					<tr th:if="${quoteError}"><td colspan="4"><div class="flash error" th:text="${quoteError}"></div>
						<form method="post" th:action="@{/pos/clear}"><button class="text small" type="submit">Clear sale</button></form></td></tr>
					</tbody>
				</table>
			</div>
		</section>

		<aside class="summary">
			<div class="card" style="display:grid;gap:.75rem">
				<h3>Customer</h3>
				<p style="margin:0" th:text="${customer} ?: 'None chosen'"></p>
				<form class="row" method="get" th:action="@{/pos}">
					<input type="hidden" name="q" th:value="${q}">
					<input type="search" name="customer" th:value="${customerQuery}" placeholder="Name, phone or username" aria-label="Find customer">
					<button class="tonal small" type="submit" style="flex:0 0 auto">Find</button>
				</form>
				<div th:if="${customers}">
					<form th:each="c : ${customers}" method="post" th:action="@{/pos/customer}" class="line">
						<input type="hidden" name="customerId" th:value="${c.id}">
						<span th:text="${c.fullName} + (${c.phone} ? ' · ' + ${c.phone} : '')"></span>
						<button class="text small" type="submit">Choose</button>
					</form>
					<p class="muted" th:if="${customers.isEmpty()}">No matching customer</p>
				</div>
				<details>
					<summary>Register a new customer</summary>
					<form class="stack" method="post" th:action="@{/pos/customer/new}" style="margin-top:.75rem">
						<th:block th:replace="~{fragments :: customer-fields(${form}, ${errors})}"></th:block>
						<button class="tonal" type="submit">Register and choose</button>
					</form>
				</details>
			</div>

			<div class="card" style="display:grid;gap:.5rem" th:if="${quote}">
				<div class="line"><span>Subtotal</span><span class="money" th:text="${@fmt.money(quote.subtotal())}"></span></div>
				<div class="line" th:if="${quote.discount().signum() > 0}">
					<span th:text="${quote.discountSource().name() == 'RULE'} ? 'Discount (offer)' : 'Discount'"></span>
					<span class="money" th:text="'−' + ${@fmt.money(quote.discount())}"></span></div>
				<div class="line"><span th:text="'GST ' + ${@fmt.percent(quote.taxRate())}"></span><span class="money" th:text="${@fmt.money(quote.tax())}"></span></div>
				<div class="line total"><span>Total</span><span class="money" th:text="${@fmt.money(quote.total())}"></span></div>
				<form class="stack" method="post" th:action="@{/pos/options}">
					<label>Payment
						<select name="paymentMode" onchange="this.form.submit()">
							<option th:each="m : ${paymentModes}" th:value="${m}" th:text="${@fmt.title(m)}" th:selected="${m == cart.getPaymentMode()}"></option>
						</select>
					</label>
					<label th:if="${management}">Manual discount (₹), empty for the best offer
						<input type="number" name="discount" step="0.01" min="0" th:value="${cart.getDiscount()}"></label>
					<button class="outlined small" type="submit">Apply</button>
				</form>
				<form method="post" th:action="@{/pos/checkout}">
					<button class="accent" type="submit" style="width:100%;justify-content:center" th:disabled="${customer == null}"
							th:text="${customer == null} ? 'Choose a customer to check out' : 'Charge ' + ${@fmt.money(quote.total())}">Charge</button>
				</form>
			</div>
		</aside>
	</div>
</div>
</body>
</html>
