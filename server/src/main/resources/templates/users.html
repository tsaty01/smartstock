<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Users', ~{::#page})}">
<body>
<div id="page">
	<div class="page-head"><h1>Users</h1></div>
	<div class="table-wrap">
		<table>
			<thead><tr><th>User</th><th>Full name</th><th>Phone</th><th>Role</th><th>Active</th><th>New password</th><th></th></tr></thead>
			<tbody>
			<tr th:each="u : ${users}">
				<td th:text="'@' + ${u.username}"></td>
				<td colspan="6">
					<form class="row" method="post" th:action="@{/users/{id}(id=${u.id})}" style="flex-wrap:nowrap">
						<input name="fullName" th:value="${u.fullName}" required maxlength="100" aria-label="Full name">
						<input name="phone" th:value="${u.phone}" pattern="[0-9]{10}" maxlength="10" aria-label="Phone">
						<input type="hidden" name="email" th:value="${u.email}">
						<select name="role" aria-label="Role" th:disabled="${u.id == me.id()}">
							<option th:each="r : ${roles}" th:value="${r}" th:text="${@fmt.title(r)}" th:selected="${r == u.role}"></option>
						</select>
						<input type="hidden" name="role" th:value="${u.role}" th:if="${u.id == me.id()}">
						<label class="check" style="flex:0 0 auto"><input type="checkbox" name="active" value="true" th:checked="${u.active}"
																			th:disabled="${u.id == me.id()}"> Active</label>
						<input type="hidden" name="active" value="true" th:if="${u.id == me.id()}">
						<input name="password" type="password" minlength="8" maxlength="72" placeholder="Unchanged" aria-label="New password" autocomplete="new-password">
						<button class="text small" type="submit" style="flex:0 0 auto">Save</button>
					</form>
				</td>
			</tr>
			</tbody>
		</table>
	</div>

	<h2>Add a user</h2>
	<form class="card stack" method="post" th:action="@{/users}">
		<div class="row">
			<label>Username <input name="username" th:value="${form?.username()}" required minlength="3" maxlength="50" pattern="[A-Za-z0-9._\-]+"></label>
			<label>Full name <input name="fullName" th:value="${form?.fullName()}" required maxlength="100"></label>
		</div>
		<span class="field-error" th:if="${errors['username']}" th:text="${errors['username']}"></span>
		<div class="row">
			<label>Role
				<select name="role">
					<option th:each="r : ${roles}" th:value="${r}" th:text="${@fmt.title(r)}" th:selected="${form != null ? r == form.role() : r.name() == 'CASHIER'}"></option>
				</select>
			</label>
			<label>Phone <input name="phone" th:value="${form?.phone()}" pattern="[0-9]{10}" maxlength="10"></label>
			<label>Email <input name="email" type="email" th:value="${form?.email()}"></label>
		</div>
		<label>Password <input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label>
		<span class="field-error" th:if="${errors['password']}" th:text="${errors['password']}"></span>
		<button type="submit" style="justify-self:start">Add user</button>
	</form>
</div>
</body>
</html>
