<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Dashboard', ~{::#page})}">
<body>
<div id="page">
	<div class="page-head">
		<h1>Today</h1>
		<a class="btn tonal" href="/alerts" th:text="'Alerts (' + ${d.unreadNotifications()} + ' unread)'">Alerts</a>
	</div>
	<div class="grid">
		<div class="metric highlight"><div class="label">Revenue</div><div class="value" th:text="${@fmt.money(d.today().revenue())}"></div></div>
		<div class="metric"><div class="label">Orders</div><div class="value" th:text="${d.today().orders()}"></div></div>
		<div class="metric"><div class="label">Customers</div><div class="value" th:text="${d.today().customers()}"></div></div>
		<div class="metric"><div class="label">Discounts</div><div class="value" th:text="${@fmt.money(d.today().discount())}"></div></div>
		<div class="metric"><div class="label">Tax</div><div class="value" th:text="${@fmt.money(d.today().tax())}"></div></div>
	</div>

	<h2>Monthly revenue</h2>
	<div class="card">
		<div class="bars" role="img" aria-label="Revenue for the last six months">
			<div class="bar" th:each="b : ${bars}" th:title="${b.label()} + ': ' + ${@fmt.money(b.revenue())}">
				<div class="fill" th:style="'height:' + ${b.percent()} + '%'"></div>
				<span th:text="${b.label()}">Jan</span>
			</div>
		</div>
	</div>

	<div class="grid" style="margin-top:1rem">
		<section>
			<h2>Top sellers, last 30 days</h2>
			<div class="table-wrap">
				<table>
					<thead><tr><th>Product</th><th class="num">Units</th><th class="num">Revenue</th></tr></thead>
					<tbody>
					<tr th:each="p : ${d.topProducts()}">
						<td><a th:href="@{/products/{id}(id=${p.id()})}" th:text="${p.name()}"></a></td>
						<td class="num" th:text="${p.units()}"></td>
						<td class="num" th:text="${@fmt.money(p.revenue())}"></td>
					</tr>
					<tr th:if="${d.topProducts().isEmpty()}"><td colspan="3" class="empty">No sales in the last 30 days</td></tr>
					</tbody>
				</table>
			</div>
		</section>
		<section>
			<h2>Needs attention</h2>
			<div class="table-wrap">
				<table>
					<thead><tr><th>Product</th><th class="num">Stock</th><th>Status</th></tr></thead>
					<tbody>
					<tr th:each="a : ${d.expired()}">
						<td><a th:href="@{/products/{id}(id=${a.id()})}" th:text="${a.name()}"></a></td>
						<td class="num" th:text="${a.stock()}"></td>
						<td><span class="pill danger" th:text="'Expired ' + ${@fmt.date(a.expiryDate())}"></span></td>
					</tr>
					<tr th:each="a : ${d.expiringSoon()}">
						<td><a th:href="@{/products/{id}(id=${a.id()})}" th:text="${a.name()}"></a></td>
						<td class="num" th:text="${a.stock()}"></td>
						<td><span class="pill warning" th:text="'Expires ' + ${@fmt.date(a.expiryDate())}"></span></td>
					</tr>
					<tr th:each="a : ${d.lowStock()}">
						<td><a th:href="@{/products/{id}(id=${a.id()})}" th:text="${a.name()}"></a></td>
						<td class="num" th:text="${a.stock()}"></td>
						<td><span class="pill warning" th:text="'Low, reorder at ' + ${a.reorderLevel()}"></span></td>
					</tr>
					<tr th:if="${d.expired().isEmpty() and d.expiringSoon().isEmpty() and d.lowStock().isEmpty()}">
						<td colspan="3" class="empty">Nothing needs attention</td>
					</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</div>
</body>
</html>
