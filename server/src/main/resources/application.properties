spring.application.name=smartstock

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartstock}
spring.datasource.username=${DB_USER:smartstock}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.mvc.format.date=iso
server.forward-headers-strategy=framework

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

smartstock.zone=Asia/Kolkata
smartstock.storage-dir=${STORAGE_DIR:./data}
smartstock.billing.tax-rate=18.00
smartstock.inventory.expiry-warning-days=30
smartstock.security.token-secret=${TOKEN_SECRET:}
smartstock.security.token-ttl=12h
