version: 2
updates:
  - package-ecosystem: gradle
    directory: /server
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: docker
    directory: /server
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
